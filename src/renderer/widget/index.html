<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>Marginalia</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget" class="collapsed">
    <!-- Collapsed: the floating pen -->
    <div id="pen" title="Marginalia: click to write">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
    </div>

    <!-- Expanded: quick capture panel -->
    <div id="panel">
      <div id="panel-header">
        <div id="drag-handle" title="Drag to move">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/>
            <circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/>
            <circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/>
          </svg>
        </div>
        <div id="session-chip" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span id="session-chip-text"></span>
        </div>
        <div class="header-actions">
          <button id="btn-pin" title="Pin expanded" class="icon-btn" aria-label="Pin expanded">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/>
            </svg>
          </button>
          <button id="btn-library" title="Open library" class="icon-btn" aria-label="Open library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </button>
          <button id="btn-collapse" title="Collapse (Esc)" class="icon-btn" aria-label="Collapse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="category-tabs" role="tablist" aria-label="Writing category"></div>

      <div id="composer">
        <div id="prompt"></div>
        <textarea id="note-text" spellcheck="false"
                  placeholder="Write here…" aria-label="Note content"></textarea>

        <div id="meta-row" hidden>
          <input id="meta-title" type="text" placeholder="Title (optional)" />
          <div class="meta-grid">
            <input id="meta-book" type="text" placeholder="Book / source" />
            <input id="meta-author" type="text" placeholder="Author" />
            <input id="meta-page" type="text" placeholder="Page" />
            <input id="meta-date" type="text" placeholder="Date" />
          </div>
          <input id="meta-tags" type="text" placeholder="Tags, comma separated" />
        </div>

        <div id="composer-footer">
          <button id="btn-details" class="ghost-btn" title="Optional details">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/>
            </svg>
            <span>Details</span>
          </button>
          <span id="saved-indicator" aria-live="polite"></span>
          <button id="btn-save" class="primary-btn" title="Save (Ctrl+Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
