<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>Marginalia</title>
  <link rel="stylesheet" href="../assets/fa/css/all.min.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget" class="collapsed">
    <!-- Collapsed: the floating pen -->
    <div id="pen" title="Marginalia: click to write">
      <i class="fa-solid fa-pen-nib" aria-hidden="true"></i>
    </div>

    <!-- Expanded: quick capture panel -->
    <div id="panel">
      <div id="panel-header">
        <div id="drag-handle" title="Drag to move">
          <i class="fa-solid fa-grip-vertical" aria-hidden="true"></i>
        </div>
        <div id="session-chip" hidden>
          <i class="fa-solid fa-book" aria-hidden="true"></i>
          <span id="session-chip-text"></span>
        </div>
        <div class="header-actions">
          <button id="btn-pin" title="Pin expanded" class="icon-btn" aria-label="Pin expanded">
            <i class="fa-solid fa-thumbtack" aria-hidden="true"></i>
          </button>
          <button id="btn-library" title="Open library" class="icon-btn" aria-label="Open library">
            <i class="fa-solid fa-book-open" aria-hidden="true"></i>
          </button>
          <button id="btn-collapse" title="Collapse (Esc)" class="icon-btn" aria-label="Collapse">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div id="category-tabs" role="tablist" aria-label="Writing category"></div>

      <div id="composer">
        <div id="prompt"></div>
        <textarea id="note-text" spellcheck="false"
                  placeholder="Write here…" aria-label="Note content"></textarea>

        <div id="meta-row" hidden>
          <input id="meta-title" type="text" placeholder="Title (optional)" />
          <div class="meta-grid">
            <input id="meta-book" type="text" placeholder="Book / source" />
            <input id="meta-author" type="text" placeholder="Author" />
            <input id="meta-page" type="text" placeholder="Page" />
            <input id="meta-date" type="text" placeholder="Date" />
          </div>
          <input id="meta-tags" type="text" placeholder="Tags, comma separated" />
        </div>

        <div id="composer-footer">
          <button id="btn-details" class="ghost-btn" title="Optional details">
            <i class="fa-solid fa-square-plus" aria-hidden="true"></i>
            <span>Details</span>
          </button>
          <span id="saved-indicator" aria-live="polite"></span>
          <button id="btn-save" class="primary-btn" title="Save (Ctrl+Enter)">
            <i class="fa-solid fa-check" aria-hidden="true"></i>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
